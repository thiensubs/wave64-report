name: Pages

# Publishes this folder as a static site. The report is one self-contained HTML file plus
# assets/, so there is nothing to build.
#
# The tgcloud copy at app8601830087.tgcloud.ai/r/rx580-white-images-fix/ stays canonical;
# this mirror points its <link rel=canonical> there so the two do not compete in search.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
